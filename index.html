<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Document Compare</title>

<!-- Parsing + diffing libraries (loaded from CDN) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsdiff/5.1.0/diff.min.js"></script>

<style>
  /* ===== Blurprint theme — Discord's feel, tuned for paper ===== */
  :root{
    --bg:#ffffff;
    --surface:#F8F9FB;
    --surface-2:#F2F3F5;
    --border:#E3E5E8;
    --border-strong:#C7CAD1;

    --text:#2E3035;
    --text-strong:#1E1F22;
    --text-secondary:#5C5E66;
    --muted:#80848E;
    --muted-2:#9A9DA5;

    --accent:#5865F2;          /* Blurple */
    --accent-deep:#4752C4;     /* Blurple Deep */
    --accent-tint:#EEF0FE;     /* Blurple Tint */
    --accent-tint-border:#E0E3FB;
    --focus-ring:#E4E7FC;

    --success:#3BA55C; --success-tint:#E7F4EC; --success-text:#2C7A47;
    --warning:#E0A416; --warning-tint:#FBF1D8; --warning-text:#9A6F0C;
    --danger:#D83C3E;  --danger-tint:#FCEDED;  --danger-text:#A82C2E; --danger-border:#EDB5B6;

    --font:'Aptos','Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,sans-serif;
    --mono:'Aptos Mono','Cascadia Code',ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box;}
  ::selection{background:#D9DDFB;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:var(--font);
    background:var(--bg);
    color:var(--text);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    /* Lock the page to the viewport: only the comparison panel scrolls. */
    display:flex;
    flex-direction:column;
    align-items:center;
    overflow:hidden;
  }
  header{
    flex:none;align-self:stretch;
    padding:22px 28px 18px;
    border-bottom:1px solid var(--border);
    text-align:center;
  }
  header h1{
    margin:0;font-size:26px;font-weight:800;letter-spacing:-.5px;color:var(--text-strong);
    display:inline-flex;align-items:center;gap:10px;
  }

  .container{
    flex:1;min-height:0;
    width:100%;max-width:1200px;margin:0 auto;padding:24px 28px 24px;
    display:flex;flex-direction:column;
  }
  .uploads,.controls,.status,.summary{flex:none;}

  /* ---- Upload area ---- */
  .uploads{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
  }
  @media (max-width:760px){.uploads{grid-template-columns:1fr;}}

  .dropzone{
    background:var(--bg);
    border:2px dashed var(--border-strong);
    border-radius:16px;
    padding:30px 22px;
    text-align:center;
    cursor:pointer;
    transition:border-color .15s, background .15s, transform .05s;
    position:relative;
  }
  .dropzone:hover{border-color:var(--accent);}
  .dropzone.dragover{border-color:var(--accent);background:var(--accent-tint);transform:scale(1.01);}
  .dropzone .label{
    font-size:12px;text-transform:uppercase;letter-spacing:1.2px;
    color:var(--muted);font-weight:700;margin-bottom:12px;
  }
  .dropzone .label.old{color:var(--danger);}
  .dropzone .label.new{color:var(--success-text);}
  .dropzone .icon{display:flex;justify-content:center;margin-bottom:12px;}
  .dropzone .icon svg{color:var(--muted);transition:color .15s;}
  .dropzone:hover .icon svg{color:var(--text-secondary);}
  .dropzone .hint{font-size:14px;color:var(--muted);}
  .dropzone .btn-pick{
    display:inline-block;margin-top:14px;padding:9px 18px;
    background:var(--accent);color:#fff;border-radius:8px;font-size:14px;font-weight:600;
  }
  .dropzone.filled{border-style:solid;border-color:var(--accent);background:var(--accent-tint);}
  .dropzone .filename{
    margin-top:10px;font-size:15px;color:var(--text-strong);font-weight:700;
    word-break:break-all;
  }
  .dropzone .filemeta{font-size:13px;color:var(--muted);margin-top:3px;}
  .dropzone .clear{
    position:absolute;top:10px;right:12px;font-size:18px;color:var(--muted);
    background:none;border:none;cursor:pointer;display:none;line-height:1;
  }
  .dropzone.filled .clear{display:block;}
  .dropzone.filled .clear:hover{color:var(--text-strong);}
  input[type=file]{display:none;}

  /* ---- Controls ---- */
  .controls{
    display:flex;align-items:center;justify-content:center;gap:24px;
    margin:28px 0 8px;flex-wrap:wrap;
  }
  .toggle{
    display:inline-flex;background:var(--surface-2);border:1px solid var(--border);
    border-radius:10px;padding:4px;
  }
  .toggle button{
    border:none;background:none;color:var(--text-secondary);
    padding:9px 18px;border-radius:7px;cursor:pointer;font-size:14px;font-weight:600;
    font-family:inherit;transition:background .15s,color .15s,box-shadow .15s;
  }
  .toggle button:hover:not(.active){color:var(--text-strong);}
  .toggle button.active{background:var(--accent);color:#fff;}

  .compare-btn{
    height:44px;padding:0 28px;font-size:15px;font-weight:600;border:none;border-radius:8px;
    background:var(--accent);color:#fff;cursor:pointer;font-family:inherit;transition:background .15s;
  }
  .compare-btn:hover{background:var(--accent-deep);}
  .compare-btn:disabled{background:var(--surface);color:var(--muted-2);border:1px solid var(--border);cursor:not-allowed;}

  .status{text-align:center;color:var(--muted);font-size:13px;min-height:18px;margin-top:8px;}
  .status.error{color:var(--danger);}

  /* ---- Results ---- */
  .results{margin-top:22px;display:none;min-height:0;flex:1;flex-direction:column;}
  .results.show{display:flex;}
  #output{flex:1;min-height:0;display:flex;flex-direction:column;}

  .summary{
    display:flex;gap:14px;justify-content:center;margin-bottom:16px;font-size:13px;color:var(--text-secondary);
    flex-wrap:wrap;
  }
  .summary .chip{background:var(--surface-2);border:1px solid var(--border);padding:6px 14px;border-radius:999px;font-weight:600;}
  .summary .chip b{color:var(--text-strong);}

  /* Side-by-side */
  .sbs-wrap{
    flex:1;min-height:0;display:flex;flex-direction:column;
    border:1px solid var(--border);border-radius:16px;overflow:hidden;background:var(--bg);
    box-shadow:0 1px 2px rgba(30,31,34,.04);
  }
  .sbs-head{
    flex:none;
    display:grid;grid-template-columns:1fr 1fr;
    font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
  }
  .sbs-head div{padding:12px 16px;border-bottom:1px solid var(--border);background:var(--surface);}
  .sbs-head .h-old{color:var(--danger);border-right:1px solid var(--border);}
  .sbs-head .h-new{color:var(--success-text);}

  /* The ONLY scroll container for side-by-side. */
  .sbs-body{flex:1;min-height:0;overflow:auto;}
  table.diff{border-collapse:collapse;width:100%;table-layout:fixed;}
  table.diff td{
    width:50%;vertical-align:top;padding:5px 18px;
    font-family:var(--font);
    font-size:14.5px;line-height:1.5;word-break:break-word;
    color:var(--text);
    border-bottom:1px solid var(--surface-2);
  }
  table.diff td.left{border-right:1px solid var(--border);}
  td.row-del{background:var(--danger-tint);}
  td.row-add{background:var(--success-tint);}
  td.row-empty{background:var(--surface);}
  .w-del{background:rgba(216,60,62,.16);color:var(--danger-text);border-radius:3px;}
  .w-add{background:rgba(59,165,92,.18);color:var(--success-text);border-radius:3px;}

  /* ---- Rich document formatting (shared by both views) ---- */
  .docview h1,.docview h2,.docview h3,.docview h4,.docview h5,.docview h6{
    margin:.25em 0;line-height:1.25;color:var(--text-strong);font-weight:700;
  }
  .docview h1{font-size:1.7em;font-weight:800;}
  .docview h2{font-size:1.4em;}
  .docview h3{font-size:1.18em;}
  .docview h4{font-size:1.05em;}
  .docview p{margin:.15em 0;}
  .docview strong,.docview b{font-weight:700;}
  .docview em,.docview i{font-style:italic;}
  .docview a{color:var(--accent);text-decoration:none;}
  .docview .b-li{display:flex;gap:8px;align-items:flex-start;margin:.1em 0;}
  .docview .b-li .bullet{color:var(--accent);font-weight:700;flex:none;line-height:1.5;}
  .docview table{border-collapse:collapse;width:100%;font-size:.92em;margin:.3em 0;}
  .docview th,.docview td{border:1px solid var(--border);padding:4px 8px;text-align:left;vertical-align:top;}
  .docview th{background:var(--surface-2);font-weight:700;}
  .docview img{max-width:100%;}

  /* Redline */
  .redline-wrap{
    flex:1;min-height:0;overflow:auto;
    border:1px solid var(--border);border-radius:16px;background:var(--bg);color:var(--text);
    padding:36px 48px;
    box-shadow:0 1px 2px rgba(30,31,34,.04);
    font-family:var(--font);font-size:16px;line-height:1.7;
    word-break:break-word;
  }
  .redline-legend{flex:none;}
  .redline-wrap ins{
    color:var(--danger);text-decoration:underline;text-decoration-color:var(--danger);
    background:var(--danger-tint);
  }
  .redline-wrap del{
    color:var(--danger);text-decoration:line-through;text-decoration-color:var(--danger);
    background:rgba(216,60,62,.06);
  }
  .redline-legend{display:flex;gap:20px;justify-content:center;margin-bottom:16px;font-size:13px;color:var(--text-secondary);}
  .redline-legend ins{color:var(--danger);text-decoration:underline;}
  .redline-legend del{color:var(--danger);text-decoration:line-through;}

  .spinner{
    display:inline-block;width:14px;height:14px;border:2px solid var(--accent-tint-border);
    border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;
    vertical-align:-2px;margin-right:6px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<header>
  <h1>📄 Document Compare</h1>
</header>

<div class="container">
  <!-- Upload zones -->
  <div class="uploads">
    <div class="dropzone" id="dz-old" data-which="old">
      <button class="clear" title="Remove" data-clear="old">&times;</button>
      <div class="label old">Old version</div>
      <div class="content">
        <div class="icon"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4"/><path d="M7 9l5-5 5 5"/><path d="M5 20h14"/></svg></div>
        <div class="hint">Drag &amp; drop a file here</div>
        <div class="btn-pick">Choose file</div>
      </div>
      <input type="file" id="file-old" accept=".txt,.md,.csv,.docx,.pdf,.rtf,.html,.htm,text/*" />
    </div>

    <div class="dropzone" id="dz-new" data-which="new">
      <button class="clear" title="Remove" data-clear="new">&times;</button>
      <div class="label new">Newer version</div>
      <div class="content">
        <div class="icon"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4"/><path d="M7 9l5-5 5 5"/><path d="M5 20h14"/></svg></div>
        <div class="hint">Drag &amp; drop a file here</div>
        <div class="btn-pick">Choose file</div>
      </div>
      <input type="file" id="file-new" accept=".txt,.md,.csv,.docx,.pdf,.rtf,.html,.htm,text/*" />
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <div class="toggle" id="mode-toggle">
      <button data-mode="sbs" class="active">Side-by-side</button>
      <button data-mode="redline">Redline</button>
    </div>
    <button class="compare-btn" id="compare-btn" disabled>Compare</button>
  </div>
  <div class="status" id="status"></div>

  <!-- Results -->
  <div class="results" id="results">
    <div class="summary" id="summary"></div>
    <div id="output"></div>
  </div>
</div>

<script>
/* ============================================================
   Document Compare — single-file tool
   ============================================================ */

if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}

const state = {
  mode: "sbs",
  docs: { old: null, new: null }   // { name, size, text }
};

const els = {
  status:  document.getElementById("status"),
  results: document.getElementById("results"),
  summary: document.getElementById("summary"),
  output:  document.getElementById("output"),
  compare: document.getElementById("compare-btn"),
};

/* ---------- File reading / text extraction ---------- */

function readAsArrayBuffer(file){
  return new Promise((res, rej)=>{
    const r = new FileReader();
    r.onload = ()=>res(r.result);
    r.onerror = rej;
    r.readAsArrayBuffer(file);
  });
}
function readAsText(file){
  return new Promise((res, rej)=>{
    const r = new FileReader();
    r.onload = ()=>res(r.result);
    r.onerror = rej;
    r.readAsText(file);
  });
}

/* A "block" preserves a piece of the document's formatting:
     { openTag, closeTag, inner, text, cmp }
   - openTag/closeTag + inner  → the fully-formatted rendering (headings, bold, lists…)
   - text  → plain text of the block (used for word-level diffing)
   - cmp   → normalized text used to match blocks between the two documents     */

async function extractBlocks(file){
  const name = (file.name || "").toLowerCase();
  const ext = name.slice(name.lastIndexOf(".") + 1);

  if (ext === "docx"){
    if (!window.mammoth) throw new Error("Word parser failed to load (check your connection).");
    const buf = await readAsArrayBuffer(file);
    const result = await mammoth.convertToHtml({ arrayBuffer: buf });
    return blocksFromHtml(result.value);
  }

  if (ext === "doc"){
    throw new Error("Legacy .doc files aren't supported — please save as .docx, PDF, or TXT.");
  }

  if (ext === "pdf"){
    if (!window.pdfjsLib) throw new Error("PDF parser failed to load (check your connection).");
    const buf = await readAsArrayBuffer(file);
    return await blocksFromPdf(buf);
  }

  if (ext === "html" || ext === "htm"){
    const raw = await readAsText(file);
    return blocksFromHtml(raw);
  }

  // txt, md, csv and everything else: plain text split into paragraphs.
  const text = await readAsText(file);
  return blocksFromPlainText(text);
}

function mkBlock(openTag, closeTag, inner, text){
  return { openTag, closeTag, inner, text, cmp: (text || "").replace(/\s+/g, " ").trim() };
}

/* Build formatted blocks from an HTML string (Word via mammoth, or .html files). */
function blocksFromHtml(htmlString){
  const doc = new DOMParser().parseFromString(htmlString, "text/html");
  const body = doc.body;
  const blocks = [];
  if (!body) return blocksFromPlainText(htmlString);

  for (const node of body.children){
    const tag = node.tagName.toLowerCase();
    if (tag === "ul" || tag === "ol"){
      for (const li of node.querySelectorAll(":scope > li")){
        const text = (li.textContent || "").replace(/\s+/g, " ").trim();
        if (!text) continue;
        blocks.push(mkBlock(
          '<div class="b-li"><span class="bullet">•</span><span>', "</span></div>",
          li.innerHTML, text));
      }
    } else if (tag === "table"){
      const text = (node.textContent || "").replace(/\s+/g, " ").trim();
      if (text) blocks.push(mkBlock("", "", node.outerHTML, text));
    } else {
      const text = (node.textContent || "").replace(/\s+/g, " ").trim();
      if (!text) continue;
      blocks.push(mkBlock("<" + tag + ">", "</" + tag + ">", node.innerHTML, text));
    }
  }
  return blocks.length ? blocks : blocksFromPlainText(body.textContent || "");
}

function blocksFromPlainText(text){
  const norm = (text || "").replace(/\r\n?/g, "\n");
  const paras = norm.split(/\n[ \t]*\n/);
  const blocks = [];
  for (const p of paras){
    const t = p.replace(/[ \t]+\n/g, "\n").trim();
    if (!t) continue;
    blocks.push(mkBlock("<p>", "</p>", escapeHtml(t).replace(/\n/g, "<br>"), t));
  }
  return blocks;
}

/* Build blocks from a PDF — one block per visual line, preserving relative font
   size and bold so headings stay big/bold and the layout reads like the file. */
async function blocksFromPdf(buf){
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const rawLines = [];

  for (let i = 1; i <= pdf.numPages; i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    let lastY = null, text = "", size = 0, boldVotes = 0, items = 0;

    const flush = () => {
      const t = text.replace(/\s+/g, " ").trim();
      if (t) rawLines.push({ text: t, size: Math.round(size), bold: boldVotes > items / 2 });
      text = ""; size = 0; boldVotes = 0; items = 0;
    };

    for (const it of content.items){
      const y = it.transform[5];
      if (lastY !== null && Math.abs(y - lastY) > 2) flush();
      text += it.str;
      const h = it.height || Math.hypot(it.transform[2], it.transform[3]) || 12;
      if (h > size) size = h;
      if (/bold|black|heavy|semibold/i.test(it.fontName || "")) boldVotes++;
      items++;
      lastY = y;
    }
    flush();
    lastY = null;
  }

  if (!rawLines.length) return [];

  // Find the body font size (the most common one) to scale everything against.
  const freq = {};
  for (const l of rawLines) freq[l.size] = (freq[l.size] || 0) + 1;
  const bodySize = +Object.keys(freq).reduce((a, b) => freq[b] > freq[a] ? b : a) || 12;

  return rawLines.map(l => {
    const px = Math.max(11, Math.min(30, Math.round((l.size / bodySize) * 15)));
    const weight = l.bold || l.size >= bodySize * 1.15 ? 700 : 400;
    const style = "font-size:" + px + "px;font-weight:" + weight + ";";
    return mkBlock('<div style="' + style + '">', "</div>", escapeHtml(l.text), l.text);
  });
}

/* ---------- Upload wiring ---------- */

function fmtSize(bytes){
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + " KB";
  return (bytes/1024/1024).toFixed(1) + " MB";
}

function setStatus(msg, isError){
  els.status.textContent = msg || "";
  els.status.classList.toggle("error", !!isError);
}

function renderDropzone(which){
  const dz = document.getElementById("dz-" + which);
  const content = dz.querySelector(".content");
  const doc = state.docs[which];
  // Remove any previously-rendered file info
  const old = dz.querySelector(".fileinfo");
  if (old) old.remove();

  if (doc){
    dz.classList.add("filled");
    content.style.display = "none";
    const info = document.createElement("div");
    info.className = "fileinfo";
    info.innerHTML =
      '<div class="filename">📑 ' + escapeHtml(doc.name) + '</div>' +
      '<div class="filemeta">' + fmtSize(doc.size) +
        ' · ' + doc.charCount.toLocaleString() + ' chars</div>';
    dz.appendChild(info);
  } else {
    dz.classList.remove("filled");
    content.style.display = "";
  }
  updateCompareEnabled();
}

async function handleFile(which, file){
  if (!file) return;
  els.status.classList.remove("error");
  els.status.innerHTML = '<span class="spinner"></span>Reading "' + escapeHtml(file.name) + '"…';
  try {
    const blocks = await extractBlocks(file);
    if (!blocks.length) throw new Error("No readable text found in " + file.name + ".");
    const charCount = blocks.reduce((n, b) => n + b.text.length, 0);
    state.docs[which] = { name: file.name, size: file.size, blocks, charCount };
    renderDropzone(which);
    setStatus("");
  } catch (err){
    console.error(err);
    state.docs[which] = null;
    renderDropzone(which);
    setStatus(err.message || ("Could not read " + file.name), true);
  }
}

function updateCompareEnabled(){
  els.compare.disabled = !(state.docs.old && state.docs.new);
}

["old","new"].forEach(which=>{
  const dz = document.getElementById("dz-" + which);
  const input = document.getElementById("file-" + which);

  dz.addEventListener("click", e=>{
    if (e.target.closest("[data-clear]")) return;
    input.click();
  });
  input.addEventListener("change", e=>{
    if (e.target.files && e.target.files[0]) handleFile(which, e.target.files[0]);
  });

  dz.addEventListener("dragover", e=>{ e.preventDefault(); dz.classList.add("dragover"); });
  dz.addEventListener("dragleave", e=>{ dz.classList.remove("dragover"); });
  dz.addEventListener("drop", e=>{
    e.preventDefault();
    dz.classList.remove("dragover");
    if (e.dataTransfer.files && e.dataTransfer.files[0]) handleFile(which, e.dataTransfer.files[0]);
  });

  dz.querySelector("[data-clear]").addEventListener("click", e=>{
    e.stopPropagation();
    state.docs[which] = null;
    input.value = "";
    renderDropzone(which);
  });
});

/* ---------- Mode toggle ---------- */

document.getElementById("mode-toggle").addEventListener("click", e=>{
  const btn = e.target.closest("button");
  if (!btn) return;
  state.mode = btn.dataset.mode;
  [...e.currentTarget.children].forEach(b=>b.classList.toggle("active", b===btn));
  // If results are already shown, re-render in the new mode.
  if (els.results.classList.contains("show")) runCompare();
});

/* ---------- Compare ---------- */

els.compare.addEventListener("click", runCompare);

function runCompare(){
  if (!(state.docs.old && state.docs.new)) return;
  setStatus("");
  const oldB = state.docs.old.blocks;
  const newB = state.docs.new.blocks;

  if (state.mode === "sbs"){
    renderSideBySide(oldB, newB);
  } else {
    renderRedline(oldB, newB);
  }
  els.results.classList.add("show");
}

/* ---------- Helpers ---------- */

function escapeHtml(s){
  return String(s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
// The fully-formatted rendering of a block.
function fullBlock(b){ return b.openTag + b.inner + b.closeTag; }

// Word-level diff of two blocks' text, wrapped back in each block's formatting.
function inlineBlockDiff(ob, nb){
  const parts = Diff.diffWordsWithSpace(ob.text, nb.text);
  let left = "", right = "";
  for (const p of parts){
    const html = escapeHtml(p.value);
    if (p.added)       right += '<span class="w-add">' + html + '</span>';
    else if (p.removed) left += '<span class="w-del">' + html + '</span>';
    else { left += html; right += html; }
  }
  return {
    left:  ob.openTag + left  + ob.closeTag,
    right: nb.openTag + right + nb.closeTag,
  };
}

/* ---------- Side-by-side renderer ----------
   Diffs the document block-by-block. A single two-column table guarantees
   matching content sits on the same row, and each cell keeps the block's
   original formatting (headings, bold, lists, font sizes…).               */

function renderSideBySide(oldB, newB){
  const diff = Diff.diffArrays(oldB.map(b => b.cmp), newB.map(b => b.cmp));
  const rows = [];
  let stats = { added:0, removed:0, changed:0 };
  let oi = 0, ni = 0;

  for (let i = 0; i < diff.length; i++){
    const part = diff[i];
    const count = part.count != null ? part.count : part.value.length;

    if (!part.added && !part.removed){
      for (let k = 0; k < count; k++){
        rows.push({ left:fullBlock(oldB[oi]), right:fullBlock(newB[ni]), lCls:"", rCls:"" });
        oi++; ni++;
      }
    } else if (part.removed){
      const next = diff[i+1];
      if (next && next.added){
        const addCount = next.count != null ? next.count : next.value.length;
        const n = Math.max(count, addCount);
        for (let k = 0; k < n; k++){
          const ob = k < count ? oldB[oi+k] : null;
          const nb = k < addCount ? newB[ni+k] : null;
          if (ob && nb){
            const d = inlineBlockDiff(ob, nb);
            rows.push({ left:d.left, right:d.right, lCls:"row-del", rCls:"row-add" });
            stats.changed++;
          } else if (ob){
            rows.push({ left:fullBlock(ob), right:"", lCls:"row-del", rCls:"row-empty" });
            stats.removed++;
          } else {
            rows.push({ left:"", right:fullBlock(nb), lCls:"row-empty", rCls:"row-add" });
            stats.added++;
          }
        }
        oi += count; ni += addCount; i++; // consume paired "added" part
      } else {
        for (let k = 0; k < count; k++){
          rows.push({ left:fullBlock(oldB[oi]), right:"", lCls:"row-del", rCls:"row-empty" });
          oi++; stats.removed++;
        }
      }
    } else { // added only
      for (let k = 0; k < count; k++){
        rows.push({ left:"", right:fullBlock(newB[ni]), lCls:"row-empty", rCls:"row-add" });
        ni++; stats.added++;
      }
    }
  }

  let bodyHtml = "";
  for (const r of rows){
    bodyHtml +=
      '<tr>' +
        '<td class="left ' + r.lCls + '">' + (r.left || "&nbsp;") + '</td>' +
        '<td class="right ' + r.rCls + '">' + (r.right || "&nbsp;") + '</td>' +
      '</tr>';
  }

  renderSummary(stats);
  els.output.innerHTML =
    '<div class="sbs-wrap">' +
      '<div class="sbs-head">' +
        '<div class="h-old">Old · ' + escapeHtml(state.docs.old.name) + '</div>' +
        '<div class="h-new">New · ' + escapeHtml(state.docs.new.name) + '</div>' +
      '</div>' +
      '<div class="sbs-body docview"><table class="diff"><tbody>' + bodyHtml + '</tbody></table></div>' +
    '</div>';
}

/* ---------- Redline renderer ----------
   Renders the new document with its formatting, then overlays:
     added text   (in new, not old) → red, underlined   (<ins>)
     removed text (in old, not new) → red, strikethrough (<del>)            */

function renderRedline(oldB, newB){
  const diff = Diff.diffArrays(oldB.map(b => b.cmp), newB.map(b => b.cmp));
  let html = "", added = 0, removed = 0;
  let oi = 0, ni = 0;

  const wordRedline = (ob, nb) => {
    const parts = Diff.diffWordsWithSpace(ob.text, nb.text);
    let inner = "";
    for (const p of parts){
      const safe = escapeHtml(p.value);
      if (p.added){ inner += "<ins>" + safe + "</ins>"; if (p.value.trim()) added++; }
      else if (p.removed){ inner += "<del>" + safe + "</del>"; if (p.value.trim()) removed++; }
      else inner += safe;
    }
    return nb.openTag + inner + nb.closeTag;
  };

  for (let i = 0; i < diff.length; i++){
    const part = diff[i];
    const count = part.count != null ? part.count : part.value.length;

    if (!part.added && !part.removed){
      for (let k = 0; k < count; k++){ html += fullBlock(newB[ni]); oi++; ni++; }
    } else if (part.removed){
      const next = diff[i+1];
      if (next && next.added){
        const addCount = next.count != null ? next.count : next.value.length;
        const n = Math.max(count, addCount);
        for (let k = 0; k < n; k++){
          const ob = k < count ? oldB[oi+k] : null;
          const nb = k < addCount ? newB[ni+k] : null;
          if (ob && nb) html += wordRedline(ob, nb);
          else if (ob){ html += ob.openTag + "<del>" + escapeHtml(ob.text) + "</del>" + ob.closeTag; removed++; }
          else { html += nb.openTag + "<ins>" + escapeHtml(nb.text) + "</ins>" + nb.closeTag; added++; }
        }
        oi += count; ni += addCount; i++;
      } else {
        for (let k = 0; k < count; k++){
          html += oldB[oi].openTag + "<del>" + escapeHtml(oldB[oi].text) + "</del>" + oldB[oi].closeTag;
          oi++; removed++;
        }
      }
    } else { // added only
      for (let k = 0; k < count; k++){
        html += newB[ni].openTag + "<ins>" + escapeHtml(newB[ni].text) + "</ins>" + newB[ni].closeTag;
        ni++; added++;
      }
    }
  }

  renderSummary({ added, removed, changed:0 }, true);
  els.output.innerHTML =
    '<div class="redline-legend">' +
      '<span><ins>underlined red</ins> = added in new version</span>' +
      '<span><del>struck-through red</del> = removed from old version</span>' +
    '</div>' +
    '<div class="redline-wrap docview">' + html + '</div>';
}

function renderSummary(stats, isRedline){
  if (isRedline){
    els.summary.innerHTML =
      '<div class="chip"><b>' + stats.added + '</b> insertions</div>' +
      '<div class="chip"><b>' + stats.removed + '</b> deletions</div>';
  } else {
    els.summary.innerHTML =
      '<div class="chip"><b>' + stats.added + '</b> added</div>' +
      '<div class="chip"><b>' + stats.removed + '</b> removed</div>' +
      '<div class="chip"><b>' + stats.changed + '</b> changed</div>';
  }
}
</script>
</body>
</html>
